<figure class="video{% if include.portrait %} video--portrait{% endif %}">
  <div class="video-frame">
    <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}"
      title="{{ include.title | default: 'Research demonstration' | escape }}"
      loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>
  </div>
  {% if include.title %}<figcaption>{{ include.title | escape }}</figcaption>{% endif %}
</figure>

<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/projects' | relative_url }}" {% if page.url contains 'projects' %}aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/publications' | relative_url }}" {% if page.url contains 'publications' %}aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/skills' | relative_url }}" {% if page.url contains 'skills' %}aria-current="page"{% endif %}>Skills</a>
      </nav>
    </header>
    <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} {{ site.title }}</span>
      <nav class="contact-links" aria-label="Contact and profiles">
        <a href="mailto:{{ site.author.email }}">Email</a>
        <a href="{{ site.scholar_url }}">Google Scholar</a>
        <a href="{{ site.github_url }}">GitHub</a>
      </nav>
    </footer>
  </div>
</body>
</html>
